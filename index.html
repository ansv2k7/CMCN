<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Giải mã các cuộc Cách mạng công nghiệp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceef0;--surface:#fff;--ink:#14202e;--mute:#5b6878;--line:#d3d8de;--a:#b87333;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1620;--surface:#16212e;--ink:#eef2f6;--mute:#93a1b2;--line:#263547}}
:root[data-theme="dark"]{--bg:#0e1620;--surface:#16212e;--ink:#eef2f6;--mute:#93a1b2;--line:#263547}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,Segoe UI,Arial,sans-serif;line-height:1.5;overflow-x:hidden}
header{max-width:1100px;margin:0 auto;padding:44px 24px 8px}
h1{font-weight:800;font-size:clamp(28px,5vw,52px);line-height:1.08;letter-spacing:-.02em;max-width:16ch}
header p{color:var(--mute);margin-top:12px;max-width:52ch}
.track{max-width:1100px;margin:28px auto 0;padding:0 24px;position:relative}
.rail{position:absolute;left:calc(24px + 12.5%);right:calc(24px + 12.5%);top:46px;height:3px;background:var(--line);border-radius:3px}
.fill{height:100%;width:0;background:var(--a);border-radius:3px;transition:width .7s cubic-bezier(.6,.1,.2,1),background .5s}
.nodes{display:grid;grid-template-columns:repeat(4,1fr);position:relative}
.node{background:none;border:0;color:var(--mute);font:inherit;cursor:pointer;padding:8px 4px 10px;text-align:center;transition:color .3s}
.node i{display:block;width:26px;height:26px;border-radius:50%;margin:20px auto 10px;background:var(--bg);border:3px solid var(--line);transition:all .4s}
.node b{display:block;font-weight:800;font-size:15px}
.node small{font-size:12px}
.node.on{color:var(--ink)}
.node.on i{border-color:var(--c);background:var(--c);box-shadow:0 0 0 7px color-mix(in srgb,var(--c) 22%,transparent)}
.node.past i{border-color:var(--c)}
.node:focus-visible{outline:2px solid var(--c);outline-offset:2px;border-radius:8px}
.stage{max-width:1100px;margin:18px auto 0;padding:0 24px 56px;position:relative}
.hero{position:relative;display:flex;align-items:center;gap:28px;padding:26px 8px 22px;min-height:190px}
.gear{position:absolute;right:-30px;top:-20px;width:260px;height:260px;opacity:.16;pointer-events:none}
.gear svg{width:100%;height:100%;animation:spin 40s linear infinite}
.gear.burst svg{animation:spin 1.2s cubic-bezier(.2,.7,.2,1) 1,spin 40s linear 1.2s infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.big{font-weight:800;font-size:clamp(64px,13vw,132px);line-height:.9;color:var(--a);letter-spacing:-.04em;transition:color .5s}
.ttl{position:relative}
.ttl h2{font-weight:800;font-size:clamp(20px,3.4vw,32px);line-height:1.15}
.ttl p{color:var(--mute);margin-top:4px}
.event{margin-top:14px;display:inline-flex;gap:10px;align-items:center;background:var(--ink);color:var(--bg);padding:8px 16px 8px 10px;border-radius:999px;font-size:14px}
.event span{background:var(--a);color:#101820;font-weight:800;padding:2px 10px;border-radius:999px;position:relative}
.event span::after{content:"";position:absolute;inset:0;border-radius:999px;border:2px solid var(--a);animation:ping 2.2s ease-out infinite}
@keyframes ping{from{transform:scale(1);opacity:.9}to{transform:scale(1.7);opacity:0}}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:6px}
.card{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--a);border-radius:10px;padding:16px 18px 18px;opacity:0;transform:translateY(14px) scale(.97);animation:in .55s cubic-bezier(.2,.8,.2,1) forwards;transition:border-color .5s}
@keyframes in{to{opacity:1;transform:none}}
.card h3{font-size:13px;color:var(--mute);font-weight:600;display:flex;gap:8px;align-items:center}
.card h3 em{font-style:normal;font-weight:800;color:var(--a)}
.card strong{display:block;font-size:19px;line-height:1.25;margin-top:8px;font-weight:800}
.card p{color:var(--mute);font-size:14px;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chips span{font-size:12.5px;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--a) 16%,transparent);border:1px solid color-mix(in srgb,var(--a) 45%,transparent)}
.hint{text-align:center;color:var(--mute);font-size:13px;margin-top:22px}
@media (max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-width:560px){.grid{grid-template-columns:1fr}.hero{flex-direction:column;align-items:flex-start;gap:8px}.node small{display:none}.gear{width:190px;height:190px;right:-40px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.card{opacity:1;transform:none}}
</style>
</head>
<body>
<header>
<h1>Giải mã các cuộc cách mạng công nghiệp</h1>
<p>Bốn cuộc cách mạng, sáu câu hỏi giống nhau. Chọn một mốc để xem.</p>
</header>

<nav class="track" aria-label="Các cuộc cách mạng công nghiệp">
<div class="rail"><div class="fill" id="fill"></div></div>
<div class="nodes" id="nodes"></div>
</nav>

<main class="stage" id="stage" aria-live="polite">
<div class="hero">
<div class="gear" id="gear"><svg viewBox="0 0 300 300" aria-hidden="true"><circle cx="150" cy="150" r="120" fill="none" stroke="var(--a)" stroke-width="34" stroke-dasharray="22.6 15.4"/><circle cx="150" cy="150" r="102" fill="none" stroke="var(--a)" stroke-width="14"/><circle cx="150" cy="150" r="26" fill="none" stroke="var(--a)" stroke-width="10"/></svg></div>
<div class="big" id="big"></div>
<div class="ttl"><h2 id="name"></h2><p id="sub"></p><div class="event" id="event"></div></div>
</div>
<div class="grid" id="grid"></div>
<p class="hint">Dùng phím ← → hoặc bấm vào mốc thời gian để chuyển cuộc cách mạng</p>
</main>

<script>
var D=[
{n:"1",c:"#b87333",name:"Cơ khí hóa",sub:"Hơi nước thay sức người, sức ngựa",
ev:["1825","Tuyến đường sắt chạy bằng hơi nước đầu tiên ở Anh"],
t:["1760 – 1840","Cuối thế kỷ XVIII đến giữa thế kỷ XIX"],
q:["Anh","Cái nôi của công nghiệp hóa"],
p:["Máy hơi nước",["Watt 1769","Máy kéo sợi Jenny","Khung cửi cơ khí"]],
s:["Nhà máy cơ khí","Thủ công chuyển sang máy móc"],
e:["Tư bản tự do cạnh tranh","Anh là công xưởng của thế giới"],
x:["Tư sản và vô sản","Đô thị hóa nhanh, công nhân bị bóc lột nặng"]},
{n:"2",c:"#d9a400",name:"Điện khí hóa",sub:"Điện năng và dây chuyền hàng loạt",
ev:["1913","Ford đưa dây chuyền lắp ráp vào sản xuất ô tô"],
t:["1870 – 1914","Cuối thế kỷ XIX đến đầu thế kỷ XX"],
q:["Mỹ, Đức","Cùng Anh và Pháp"],
p:["Điện và động cơ đốt trong",["Bóng đèn Edison","Thép Bessemer","Điện thoại"]],
s:["Dây chuyền hàng loạt","Phân công lao động chuyên môn hóa"],
e:["Tư bản độc quyền","Tư bản tài chính, tập đoàn lớn nổi lên"],
x:["Chủ nghĩa đế quốc","Tranh giành thuộc địa, dẫn tới Thế chiến I"]},
{n:"3",c:"#1f8ccf",name:"Tự động hóa",sub:"Máy tính và điện tử số",
ev:["1969","ARPANET gửi tin nhắn đầu tiên, tiền thân của Internet"],
t:["1969 – 2010","Từ giữa thế kỷ XX đến đầu thế kỷ XXI"],
q:["Mỹ","Cùng Nhật và Tây Âu"],
p:["Máy tính và Internet",["Bán dẫn, vi xử lý","Robot công nghiệp","PLC"]],
s:["Tự động hóa","Máy điều khiển máy, sản xuất theo chương trình"],
e:["Toàn cầu hóa","Chuỗi giá trị toàn cầu, kinh tế tri thức"],
x:["Chiến tranh Lạnh","Lao động dịch chuyển sang dịch vụ và tri thức"]},
{n:"4",c:"#10b58a",name:"Số hóa thông minh",sub:"Vật lý, số và sinh học hòa vào nhau",
ev:["2022","AI tạo sinh như ChatGPT phổ cập toàn cầu"],
t:["2011 – nay","Khái niệm Industrie 4.0 ra đời năm 2011"],
q:["Đức","Nơi nêu khái niệm; Mỹ, Trung Quốc cùng dẫn dắt"],
p:["AI, IoT, dữ liệu lớn",["Robot thông minh","In 3D","Điện toán đám mây"]],
s:["Nhà máy thông minh","Hệ thống thực ảo kết nối, tự ra quyết định"],
e:["Kinh tế số","Nền tảng và dữ liệu là tài nguyên mới"],
x:["Cạnh tranh công nghệ","Việc làm thay đổi, đạo đức AI thành vấn đề lớn"]}];
var L=["Thời gian","Quốc gia khởi phát","Phát minh đột phá","Hệ thống sản xuất","Quan hệ kinh tế","Chính trị – Xã hội"];
var K=["t","q","p","s","e","x"];
var cur=0,$=function(i){return document.getElementById(i)};
var nodes=$("nodes");
D.forEach(function(d,i){var b=document.createElement("button");b.className="node";b.style.setProperty("--c",d.c);
b.innerHTML="<i></i><b>CMCN "+d.n+"</b><small>"+d.t[0]+"</small>";b.onclick=function(){go(i)};nodes.appendChild(b)});
function go(i){
cur=i;var d=D[i];
document.documentElement.style.setProperty("--a",d.c);
$("fill").style.width=(i/3*100)+"%";
Array.prototype.forEach.call(nodes.children,function(n,k){n.className="node"+(k===i?" on":"")+(k<i?" past":"")});
$("big").textContent=d.n;
$("name").textContent="Cách mạng công nghiệp lần "+d.n+": "+d.name;
$("sub").textContent=d.sub;
$("event").innerHTML="<span>"+d.ev[0]+"</span>"+d.ev[1];
var g=$("grid");g.innerHTML="";
K.forEach(function(k,j){var v=d[k],c=document.createElement("div");c.className="card";c.style.animationDelay=(j*70)+"ms";
var body=Array.isArray(v[1])?'<div class="chips">'+v[1].map(function(x){return"<span>"+x+"</span>"}).join("")+"</div>":"<p>"+v[1]+"</p>";
c.innerHTML="<h3><em>0"+(j+1)+"</em>"+L[j]+"</h3><strong>"+v[0]+"</strong>"+body;g.appendChild(c)});
var ge=$("gear");ge.classList.remove("burst");void ge.offsetWidth;ge.classList.add("burst");
}
document.addEventListener("keydown",function(e){if(e.key==="ArrowRight")go(Math.min(3,cur+1));if(e.key==="ArrowLeft")go(Math.max(0,cur-1))});
go(0);
</script>
</body>
</html>
